# Haalt elke nacht voorbije beurs-edities uit /beurzen/ door
# tools/build-beurzen.mjs te draaien. Alleen als er iets verandert
# wordt er gecommit; Cloudflare deployt dat daarna vanzelf.
# Handmatig draaien: GitHub, tabblad Actions, "Beurzenagenda bijwerken", Run workflow.
name: Beurzenagenda bijwerken

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bouw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Agenda opnieuw opbouwen
        env:
          TZ: Europe/Amsterdam
        run: node tools/build-beurzen.mjs
      - name: Committen als er iets veranderd is
        run: |
          if git diff --quiet; then
            echo "Geen wijzigingen."
            exit 0
          fi
          git config user.name "beurzen-bot"
          git config user.email "actions@users.noreply.github.com"
          git add beurzen/index.html
          git commit -m "Beurzenagenda: voorbije edities verwijderd"
          git push
